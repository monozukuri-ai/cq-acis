[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cq-acis"
dynamic = ["version"]
description = "ACIS SAT/SAB parsing experiments for CadQuery"
readme = "README.md"
requires-python = ">=3.11"
# Parsing and the shared model need no geometry kernel. Shape conversion needs
# one of the extras below (0.4.0; earlier releases required CadQuery outright).
dependencies = []
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[project.optional-dependencies]
# CadQuery shapes and Workplanes (to_cadquery, import_sat_*, from_cadquery).
cadquery = [
    "cadquery>=2.8",
    # These Windows wheels use different SWIG runtime tables. Loading versions
    # that share a table can corrupt the heap during interpreter shutdown.
    # https://github.com/casadi/casadi/issues/4403
    "casadi==3.7.2; sys_platform == 'win32'",
    "nlopt==2.11.0; sys_platform == 'win32'",
]
# Bare OCCT shapes through OCP without VTK (convert_model_occt, backend="occt").
occt = ["cadquery-ocp-novtk>=7.9.3.1,<7.10"]

[tool.maturin]
strip = true
manifest-path = "crates/cq-acis-py/Cargo.toml"
python-source = "src"
module-name = "cq_acis._native"
features = ["pyo3/extension-module"]
include = [
    { path = "docs/*.md", format = ["sdist", "wheel"] },
    { path = "README.ja.md", format = "sdist" },
]
exclude = [".internal/**", "corpus/**", "tests/**", "examples/**"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
