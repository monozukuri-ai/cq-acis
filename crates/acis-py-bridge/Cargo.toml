[package]
name = "acis-py-bridge"
version = "0.2.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Shared PyO3 conversion for the cq-acis Python model API"
repository = "https://github.com/monozukuri-ai/cq-acis"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
acis-core = "=0.2.1"
num-bigint = "0.4.7"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "num-bigint"] }
