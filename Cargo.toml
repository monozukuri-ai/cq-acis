[workspace]
members = ["crates/acis-core", "crates/cq-acis-py", "crates/acis-py-bridge"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/monozukuri-ai/cq-acis"

[workspace.dependencies]
num-bigint = "0.4.7"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "num-bigint"] }
