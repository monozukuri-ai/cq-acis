name: Python release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Check version and source regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Check Python release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: python scripts/check_python_release.py --tag "$RELEASE_TAG"
      - name: Test release safeguards
        run: python -m unittest discover -s scripts/tests -v
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build editable extension and run Python regressions
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install 'maturin[patchelf]==1.11.5'
          maturin develop --release --locked
          python -m unittest discover -s tests -v

  wheels:
    name: Wheel (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.11
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: auto
            interpreter: python
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
            interpreter: python
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
            interpreter: python
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: minimum
        with:
          python-version: "3.10"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          rust-toolchain: 1.93.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --interpreter ${{ matrix.interpreter }} --compatibility pypi
      - name: Verify archive metadata and license files
        run: python scripts/check_python_release.py --dist dist
      - name: Install wheel with dependencies on Python 3.10 and 3.11
        env:
          MINIMUM_PYTHON: ${{ steps.minimum.outputs.python-path }}
        run: python scripts/smoke_python_release.py --dist dist --python "$MINIMUM_PYTHON" --python python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution and rebuild
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.93.0
      - name: Build source distribution
        run: |
          python -m pip install 'maturin[patchelf]==1.11.5'
          maturin sdist --out dist
      - name: Verify source contents
        run: python scripts/check_python_release.py --dist dist --wheels 0 --sdists 1
      - name: Rebuild and test from the source distribution
        run: python scripts/smoke_python_release.py --dist dist --sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to PyPI
    if: github.event_name == 'release' && github.repository == 'monozukuri-ai/cq-acis'
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/cq-acis
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-release-*
          path: dist
          merge-multiple: true
      - name: Verify complete artifact set and PyPI retry compatibility
        run: python scripts/check_python_release.py --dist dist --wheels 4 --sdists 1 --check-pypi
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # The preceding digest check allows only byte-identical retries.
          skip-existing: true
          print-hash: true
